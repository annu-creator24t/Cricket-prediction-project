paths:
  raw_data: "data/raw/"
  processed_data: "artifacts/processed/cleaned_data.csv"
  batter_dataset: "artifacts/processed/batter_training_data.csv"
  bowler_dataset: "artifacts/processed/bowler_training_data.csv"
  model_dir: "artifacts/models/"
  batter_model: "artifacts/models/batter_best_model.pkl"
  bowler_model: "artifacts/models/bowler_best_model.pkl"
  shap_dir: "artifacts/shap/"

split:
  test_size: 0.20
  time_aware: true

models:
  candidate_models:
    - "CatBoost"
    - "XGBoost"
    - "LightGBM"
    - "RandomForest"
    - "ExtraTrees"
  random_state: 42

features:
  batter:
    categorical:
      - batsman
      - batting_team
      - bowling_team
      - venue
    numeric:
      - prev_runs
      - last_5_avg
      - last_10_avg
      - career_avg
    target: runs_next_match
  bowler:
    categorical:
      - bowler
      - bowling_team
      - batting_team
      - venue
    numeric:
      - prev_wickets
      - last_5_wkts
      - last_10_wkts
      - career_wkt_avg
    target: wickets_next_match